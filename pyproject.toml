[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creditboost"
version = "0.1.0"
description = "Loan default risk scoring for thin-file borrowers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # xgboost's Linux wheels pull in ~291MB of NVIDIA CUDA libraries that
    # CPU-only inference never uses; macOS has no CUDA build anyway, and
    # xgboost-cpu ships no macOS wheel, so the CPU-only build is scoped to
    # Linux (the runtime image and CI) while other platforms keep the
    # standard package.
    "xgboost-cpu>=2.1; platform_system == 'Linux'",
    "xgboost>=2.1; platform_system != 'Linux'",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.5"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
    "import-linter>=2.0",
]

[project.scripts]
creditboost-train = "creditboost.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creditboost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# No `packages` key: CI invokes `mypy src/`, and mypy rejects a path argument
# when packages is also configured.

[tool.importlinter]
root_package = "creditboost"

[[tool.importlinter.contracts]]
name = "Runtime and artifact tooling never reach training code"
type = "forbidden"
# This is the one-way dependency rule that keeps scikit-learn out of the
# runtime image -- and, since the Docker builder stage installs the base
# package only, it is also what stops the artifact CLI crashing at build time.
# A static contract suits a static rule: it sees the whole import graph, so it
# catches transitive and guarded imports alike, and reports the full chain.
source_modules = [
    "creditboost.serve",
    "creditboost.artifact",
    "creditboost.features",
    "creditboost.schema",
    "creditboost.banding",
    "creditboost.config",
    "creditboost.hashing",
]
forbidden_modules = [
    "creditboost.data",
    "creditboost.train",
]
