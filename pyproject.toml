[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creditboost"
version = "0.1.0"
description = "Loan default risk scoring for thin-file borrowers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "xgboost>=2.1",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.5"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs",
]

[project.scripts]
creditboost-train = "creditboost.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creditboost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# No `packages` key: CI invokes `mypy src/`, and mypy rejects a path argument
# when packages is also configured.
